<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Vice.ai Studio</title>
<meta name=description content="Make ready-to-post Shorts in your browser. Upload a video, get finished 9:16 Shorts with captions and hooks.">
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@500;600;700&display=swap" rel=stylesheet>
<style>
:root{--bg:#F4F7FF;--p:#fff;--c:#EEF2FF;--l:#DFE5F5;--t:#0B1220;--m:#5A6478;--a:#2F54FF;--ok:#12B76A;--f:#F04438;
  --grad:linear-gradient(135deg,#2F54FF 0%,#5B74FF 60%,#7C93FF 100%);--sh:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(47,84,255,.06);--fd:'Montserrat','Arial Black',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(80% 60% at 50% -10%,#DCE6FF 0%,rgba(220,230,255,0) 70%),var(--bg)}
a{color:var(--a)}h1,h2,h3{font-family:var(--fd);letter-spacing:-.03em;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 22px;font:600 15px 'Poppins',sans-serif;border:1px solid var(--l);background:#fff;color:var(--t);cursor:pointer;text-decoration:none;transition:transform .18s,box-shadow .18s,opacity .18s}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.p{background:var(--grad);color:#fff;border:0;box-shadow:0 10px 26px rgba(47,84,255,.32)}
.btn.s{padding:8px 14px;font-size:13px}
nav{position:sticky;top:12px;z-index:20;margin:14px auto 0;width:min(1100px,calc(100% - 32px));display:flex;align-items:center;gap:10px;padding:10px 10px 10px 20px;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border:1px solid var(--l);border-radius:999px;box-shadow:0 10px 30px rgba(47,84,255,.1)}
.logo{display:flex;align-items:center;gap:9px;font:900 22px var(--fd);letter-spacing:-.03em;color:var(--t);text-decoration:none}.logo svg{width:30px;height:30px}
.tag{font:700 11px 'Poppins';letter-spacing:.08em;text-transform:uppercase;color:var(--a);background:var(--c);border-radius:999px;padding:3px 9px}
.sp{flex:1}.who{font-size:13px;color:var(--m);text-align:right;line-height:1.3}.who b{color:var(--t)}
main{width:min(1100px,calc(100% - 32px));margin:28px auto 80px}
.card{background:var(--p);border:1px solid var(--l);border-radius:24px;box-shadow:var(--sh);padding:28px}
.hero h1{font-size:clamp(28px,4vw,40px)}.hero p{color:var(--m);margin:6px 0 20px}
.drop{border:2px dashed #C5D0F0;border-radius:20px;padding:34px 20px;text-align:center;cursor:pointer;transition:background .2s,border-color .2s;background:#FAFBFF}
.drop:hover,.drop.on{background:var(--c);border-color:var(--a)}
.drop .ic{width:54px;height:54px;margin:0 auto 10px;border-radius:16px;background:var(--grad);display:grid;place-items:center;box-shadow:0 10px 24px rgba(47,84,255,.3)}
.drop .ic svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.drop b{display:block;font-size:17px}.drop span{color:var(--m);font-size:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:18px}
.row label{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
input[type=range]{accent-color:var(--a);width:160px}
.file{font-size:14px;color:var(--m);flex:1;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--c);overflow:hidden;margin-top:14px;display:none}.bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}
.msg{min-height:22px;font-size:14px;margin-top:10px;color:var(--m)}.msg.err{color:var(--f)}.msg.ok{color:var(--ok)}
h2{font-size:22px;margin:36px 0 14px}
.job{margin-bottom:16px}.jh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.jh h3{font:600 16px 'Poppins';letter-spacing:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:4px 10px;background:var(--c);color:var(--a);display:inline-flex;align-items:center;gap:6px}
.pill.done{background:#E7F8F0;color:var(--ok)}.pill.failed{background:#FDECEB;color:var(--f)}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(1turn)}}
.when{font-size:13px;color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:16px}
.short{background:#0B1220;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.short video{width:100%;aspect-ratio:9/16;display:block;background:#000;object-fit:cover}
.short .act{display:flex;gap:6px;padding:8px;background:#fff;border:1px solid var(--l);border-top:0;border-radius:0 0 16px 16px}
.short .act .btn{flex:1;padding:7px 6px;font-size:12px;white-space:nowrap}
.err-t{color:var(--f);font-size:14px;margin-top:8px}
.empty{color:var(--m);text-align:center;padding:30px}
.gate{max-width:420px;margin:40px auto}.gate h1{font-size:28px;margin-bottom:6px}.gate p{color:var(--m);margin:0 0 18px}
.gate form{display:grid;gap:12px}.gate label{display:grid;gap:6px;font-size:14px;font-weight:600}
.gate input{font:15px 'Poppins';padding:12px 14px;border:1px solid var(--l);border-radius:12px;background:#FAFBFF}
.gate input:focus{outline:2px solid var(--a);outline-offset:1px}
[hidden]{display:none!important}
@media(max-width:600px){nav{padding-left:14px}.logo{font-size:19px}.card{padding:20px}.who{display:none}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<nav>
  <a class=logo href="/"><svg viewBox="0 0 256 256" aria-hidden=true><defs><linearGradient id=g x1=0 y1=0 x2=1 y2=1><stop offset=0 stop-color="#2F54FF"/><stop offset=1 stop-color="#6E8BFF"/></linearGradient></defs><rect x=16 y=16 width=224 height=224 rx=64 fill="url(#g)"/><path d="M70 82l58 104 58-104" fill=none stroke="#fff" stroke-width=26 stroke-linecap=round stroke-linejoin=round /><circle cx=188 cy=188 r=14 fill="#fff"/></svg>Vice.ai</a>
  <span class=tag>Studio</span><span class=sp></span>
  <div class=who id=who></div>
  <button class="btn s" id=out hidden>Sign out</button>
</nav>

<main>
  <section class="card gate" id=gate hidden>
    <h1>Sign in to Studio</h1><p>Use the account you made on viceai.live.</p>
    <form id=gf><label>Email<input id=ge type=email autocomplete=email required></label><label>Password<input id=gp type=password autocomplete=current-password required></label>
      <button class="btn p" id=gb>Sign in</button></form>
    <div class=msg id=gm></div>
    <p style="margin-top:14px;font-size:14px">No account yet? <a href="/#pricing">Pick a plan</a> · <a href="/#signin">Forgot password?</a></p>
  </section>

  <section class="card gate" id=app hidden>
    <h1 id=lt>Opening your Vice.ai…</h1>
    <p id=ls>Starting your own copy of the app. This takes a few seconds the first time.</p>
    <div class=bar style="display:block"><i id=lb style="width:8%"></i></div>
    <div class=msg id=lm></div>
    <p style="margin-top:14px;font-size:14px" id=lx hidden><button class="btn p" id=lr>Try again</button></p>
  </section>
</main>

<script>
const CFG = {
  supabase: "https://tsgqmbjmgwpjxcyrbmds.supabase.co",
  key: "sb_publishable_ZU-yY6eHL5lPpO8CoTiu8Q_HQRg4wdS",
  gate: "https://kiermedia2025--viceai-online-appgw.us-east.modal.run",   // each customer's own Vice.ai app (online/modal_app.py appgw)
};
const $ = id => document.getElementById(id);
const say = (el, t, k) => { $(el).textContent = t || ''; $(el).className = 'msg' + (k ? ' ' + k : ''); };
let S = null;
try { S = JSON.parse(localStorage.getItem('vice_s') || 'null'); } catch (e) {}
const keep = d => { S = d ? { access_token: d.access_token, refresh_token: d.refresh_token, exp: Date.now() / 1000 + (d.expires_in || 3600) - 60, email: d.user?.email || S?.email } : null;
  try { d ? localStorage.setItem('vice_s', JSON.stringify(S)) : localStorage.removeItem('vice_s'); } catch (e) {} };
async function authPost(path, body) {
  const r = await fetch(CFG.supabase + '/auth/v1/' + path, { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return [r.status, await r.json().catch(() => ({}))];
}
async function token() {
  if (!S) return null;
  if (Date.now() / 1000 < S.exp) return S.access_token;
  const [c, d] = await authPost('token?grant_type=refresh_token', { refresh_token: S.refresh_token });
  if (c >= 400 || !d.access_token) { keep(null); return null; }
  keep(d); return S.access_token;
}
$('gf').onsubmit = async e => {
  e.preventDefault(); $('gb').disabled = true; say('gm', 'Signing in…');
  const [c, d] = await authPost('token?grant_type=password', { email: $('ge').value.trim(), password: $('gp').value });
  $('gb').disabled = false; $('gp').value = '';
  if (c >= 400 || !d.access_token) return say('gm', d.msg || d.error_description || 'Wrong email or password.', 'err');
  keep(d); show();
};
$('out').onclick = () => { keep(null); show(); };
$('lr').onclick = () => launch();
let tick = null;
async function launch() {
  $('lx').hidden = true; say('lm', ''); $('lt').textContent = 'Opening your Vice.ai…';
  let w = 8; clearInterval(tick); tick = setInterval(() => { w = Math.min(92, w + (92 - w) * 0.06); $('lb').style.width = w + '%'; }, 400);
  const t = await token(); if (!t) { clearInterval(tick); return show(); }
  try {
    const r = await fetch(CFG.gate + '/session', { method: 'POST', headers: { Authorization: 'Bearer ' + t } });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { keep(null); clearInterval(tick); return show(); }
    if (r.status === 402) { clearInterval(tick); $('lt').textContent = 'Choose a plan to start'; $('ls').innerHTML = 'Your account doesn\'t have a plan yet. <a href="/#pricing">See plans</a>'; return; }
    if (!r.ok || !d.url) throw new Error(d.detail || 'Vice.ai didn\'t start.');
    $('lb').style.width = '100%'; location.href = CFG.gate + d.url;
  } catch (e) {
    clearInterval(tick); say('lm', (e.message || '').includes('fetch') ? 'Couldn\'t reach Vice.ai. Check your connection.' : e.message, 'err'); $('lx').hidden = false;
  }
}
function show() {
  const inn = !!S; $('gate').hidden = inn; $('app').hidden = !inn; $('out').hidden = !inn;
  $('who').innerHTML = inn ? '<b>' + (S.email || '').replace(/[<>&]/g, '') + '</b>' : '';
  if (inn) launch();
}
show();
</script>
</body>
</html>
